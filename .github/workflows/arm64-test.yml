name: ARM64 build and tests

on:
  push:
    branches: [main, ci/arm64]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: PostgreSQL ${{ matrix.pg_version }} (ARM64)
    runs-on: ubuntu-24.04-arm
    container: ubuntu:24.04
    strategy:
      fail-fast: false
      matrix:
        pg_version: [12, 13, 14, 15, 16, 17, 18]
    env:
      DEBIAN_FRONTEND: noninteractive
      LANG: C
      PGVERSION: ${{ matrix.pg_version }}
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL and build tools
        run: |
          test "$(uname -m)" = aarch64
          apt-get update
          apt-get install -y ca-certificates curl
          curl --fail --show-error --silent https://www.postgresql.org/media/keys/ACCC4CF8.asc -o /usr/share/keyrings/pgdg.asc
          echo "deb [signed-by=/usr/share/keyrings/pgdg.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main $PGVERSION" > /etc/apt/sources.list.d/pgdg.list
          apt-get update
          apt-get install -y gcc make postgresql-$PGVERSION postgresql-server-dev-$PGVERSION
          gcc -dumpmachine
          pg_createcluster --start "$PGVERSION" test -p 55435 -- -A trust
      - name: Build and install
        run: make install PG_CONFIG=/usr/lib/postgresql/$PGVERSION/bin/pg_config
      - name: Run regression tests
        run: PGPORT=55435 make installcheck PGUSER=postgres PG_CONFIG=/usr/lib/postgresql/$PGVERSION/bin/pg_config
      - name: Upload regression failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: arm64-pg${{ matrix.pg_version }}-regression
          path: |
            regression.diffs
            regression.out
            results/
          if-no-files-found: ignore

  docker:
    name: PostgreSQL ${{ matrix.pg_version }} Docker (ARM64)
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        pg_version: [12, 13, 14, 15, 16, 17, 18]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image without publishing
        run: |
          docker build --platform linux/arm64 --build-arg PGVERSION=${{ matrix.pg_version }} --build-arg UINT128_VERSION=ci -t uint128:test .
          test "$(docker image inspect uint128:test --format '{{.Architecture}}')" = arm64
      - name: Test Docker image
        run: |
          docker run -d --name uint128-test -e POSTGRES_HOST_AUTH_METHOD=trust uint128:test
          ready=false
          for attempt in $(seq 1 60); do
            if docker exec uint128-test pg_isready -h 127.0.0.1 -U postgres; then
              ready=true
              break
            fi
            sleep 1
          done
          test "$ready" = true
          expected=$(sed -n "s/default_version = '\([^']*\)'/\1/p" uint128.control)
          actual=$(docker exec uint128-test psql -XAt -U postgres -v ON_ERROR_STOP=1 -c "SELECT extversion FROM pg_extension WHERE extname = 'uint128'")
          test "$actual" = "$expected"
          docker exec uint128-test psql -X -U postgres -v ON_ERROR_STOP=1 -c "SELECT 1::uint16 + 2::uint16, 3::uint16 - 1::uint16"
      - name: Show Docker logs and clean up
        if: always()
        run: |
          docker logs uint128-test || true
          docker rm -fv uint128-test || true
