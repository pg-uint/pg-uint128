name: Publish Docker image

on:
  release:
    types: [published]

jobs:
  push_to_registry:
    name: Build PostgreSQL ${{ matrix.pg_version }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        pg_version: [ 12, 13, 14, 15, 16, 17, 18 ]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm

    env:
      REGISTRY: docker.io
      IMAGE_NAME: codercms/postgres-uint128

    permissions:
      packages: write
      contents: read
      attestations: write
      id-token: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Log in to Docker Hub
        uses: docker/login-action@f4ef78c080cd8ba55a85445d5b36e214a81df20a
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@3b5e8027fcad23fda98b2e3ac259d8d67585f671
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ matrix.pg_version }}-${{ github.event.release.tag_name }}-${{ matrix.arch }}
          build-args: |
            PGVERSION=${{ matrix.pg_version }}
            UINT128_VERSION=${{ github.event.release.tag_name }}

  merge:
    name: Publish PostgreSQL ${{ matrix.pg_version }} multi-platform image
    needs: push_to_registry
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        pg_version: [12, 13, 14, 15, 16, 17, 18]
    env:
      REGISTRY: docker.io
      IMAGE_NAME: codercms/postgres-uint128
      PGVERSION: ${{ matrix.pg_version }}
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    permissions:
      contents: read
      attestations: write
      id-token: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Log in to Docker Hub
        uses: docker/login-action@f4ef78c080cd8ba55a85445d5b36e214a81df20a
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Publish combined image tags
        id: manifest
        run: |
          docker buildx imagetools create \
            --tag "$IMAGE_NAME:$PGVERSION-$RELEASE_TAG" \
            --tag "$IMAGE_NAME:$PGVERSION-latest" \
            "$IMAGE_NAME:$PGVERSION-$RELEASE_TAG-amd64" \
            "$IMAGE_NAME:$PGVERSION-$RELEASE_TAG-arm64"
          digest=$(docker buildx imagetools inspect "$IMAGE_NAME:$PGVERSION-$RELEASE_TAG" --format '{{.Manifest.Digest}}')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME}}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true
